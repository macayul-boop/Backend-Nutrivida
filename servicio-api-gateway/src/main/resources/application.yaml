server:
  port: 8080

spring:
  application:
    name: servicio-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: servicio-usuario
              uri: lb://servicio-usuario
              predicates:
                - Path=/api/usuarios/**
            - id: servicio-reserva
              uri: lb://servicio-reserva
              predicates:
                - Path=/api/servicios/**, /api/reservas/**
            - id: servicio-datos-clinicos
              uri: lb://servicio-datos-clinicos
              predicates:
                - Path=/api/fichas-clinicas, /api/fichas-clinicas/**

            # --- RUTAS NUEVAS PARA LA DOCUMENTACIÓN (SWAGGER) ---

            - id: usuario-docs
              uri: lb://servicio-usuario
              predicates:
                - Path=/v3/api-docs/usuario
              filters:
                - RewritePath=/v3/api-docs/usuario, /v3/api-docs

            - id: reserva-docs
              uri: lb://servicio-reserva
              predicates:
                - Path=/v3/api-docs/reserva
              filters:
                - RewritePath=/v3/api-docs/reserva, /v3/api-docs

            - id: datos-clinicos-docs
              uri: lb://servicio-datos-clinicos
              predicates:
                - Path=/v3/api-docs/datos-clinicos
              filters:
                - RewritePath=/v3/api-docs/datos-clinicos, /v3/api-docs

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://nutrivida-frontend.s3-website-us-east-1.amazonaws.com"
                  - "http://nutrivida-frontend.s3-website-us-east-1.amazonaws.com"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Microservicio usuario
        url: /v3/api-docs/usuario
      - name: Microservicio reserva
        url: /v3/api-docs/reserva
      - name: Microservicio datos clinicos
        url: /v3/api-docs/datos-clinicos