server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/nutrivida_usuario
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://servicio-eureka:8761/eureka/