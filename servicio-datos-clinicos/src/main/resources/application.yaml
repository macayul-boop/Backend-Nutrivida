server:
  port: ${PORT:8083}

spring:
  application:
    name: servicio-datos-clinicos

  datasource:
    url: jdbc:h2:mem:datosclinicos;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  security:
    jwt:
      secret: ${JWT_SECRET} # 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970


eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true