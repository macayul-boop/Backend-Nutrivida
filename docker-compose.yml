services:

  # Base de datos
  mysql:
    image: mysql:8.4
    container_name: nutrivida-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servidor Eureka
  servicio-eureka:
    build:
      context: .
      dockerfile: servicio-eureka/Dockerfile
    image: nutrivida-eureka
    container_name: nutrivida-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"

  # Microservicio de usuarios
  servicio-usuario:
    build:
      context: .
      dockerfile: servicio-usuario/Dockerfile
    image: nutrivida-usuario
    container_name: nutrivida-usuario
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      servicio-eureka:
        condition: service_started

  # Microservicio de reservas
  servicio-reserva:
    build:
      context: .
      dockerfile: servicio-reserva/Dockerfile
    image: nutrivida-reserva
    container_name: nutrivida-reserva
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      servicio-eureka:
        condition: service_started

  # Microservicio de datos clínicos
  servicio-datos-clinicos:
    build:
      context: .
      dockerfile: servicio-datos-clinicos/Dockerfile
    image: nutrivida-datos-clinicos
    container_name: nutrivida-datos-clinicos
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      servicio-eureka:
        condition: service_started

  # API Gateway
  servicio-api-gateway:
    build:
      context: .
      dockerfile: servicio-api-gateway/Dockerfile
    image: nutrivida-api-gateway
    container_name: nutrivida-api-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      servicio-eureka:
        condition: service_started
      servicio-usuario:
        condition: service_started
      servicio-reserva:
        condition: service_started
      servicio-datos-clinicos:
        condition: service_started

volumes:
  mysql_data:
